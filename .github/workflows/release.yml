name: Release

on:
  push:
    branches: [main]

# Read-only floor. release-please re-declares its own scope, which replaces
# this block rather than adding to it — so the default stays least-privilege
# even if a new job forgets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Version bumps, CHANGELOGs, git tags, and GitHub Releases from Conventional
  # Commits — nothing here publishes anywhere. InstaFix isn't on the npm
  # registry (deliberate; see the README's Quickstart); the actual
  # distribution mechanism is `bun run release:dist`, which force-pushes each
  # package's build output to a disposable `<package>-dist` branch. That's a
  # separate, manually-run step (scripts/release-dist-branch.mjs) — not wired
  # into this workflow.
  release-please:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action authenticates with RELEASE_PAT; these grants document what a
    # fallback to GITHUB_TOKEN would need (release PRs, tags, labels).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
