name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          JSON array of package paths to (re-)publish to npm, e.g.
          ["packages/widget"]. Leave empty for the normal flow (publish only
          what release-please just released). Use this to retry a publish
          that failed after the release/tag was already created — no new
          release-please run is needed, since a version tag isn't reusable.
        required: false
        type: string

# Read-only floor. release-please re-declares its own scope, which replaces
# this block rather than adding to it — so the default stays least-privilege
# even if a new job forgets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Version bumps, CHANGELOGs, git tags, and GitHub Releases from Conventional
  # Commits. Two independent distribution channels read this job's output:
  # `publish` below (npm registry, stable — one release per package version)
  # and `bun run release:dist` (GitHub `<package>-dist` branches, nightly —
  # scripts/release-dist-branch.mjs, run manually, always tracks the tip of
  # main regardless of whether a release was just cut).
  release-please:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action authenticates with RELEASE_PAT; these grants document what a
    # fallback to GITHUB_TOKEN would need (release PRs, tags, labels).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm registry, stable channel. Runs once per package that actually got a
  # new version this push (release-please's paths_released — a JSON array of
  # manifest keys, e.g. ["packages/widget"] — becomes the matrix directly, so
  # a merged-but-versionless commit publishes nothing). `--provenance` needs
  # `id-token: write`; NPM_TOKEN must be an npm Automation token with publish
  # rights on the @instafix scope (see package-install-guide.md).
  publish:
    needs: release-please
    if: >-
      ${{
        needs.release-please.outputs.releases_created == 'true' ||
        inputs.packages != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages || needs.release-please.outputs.paths_released || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build
        env:
          PACKAGE_PATH: ${{ matrix.package }}
        run: bun run build --filter="./$PACKAGE_PATH"

      - name: Publish to npm
        working-directory: ${{ matrix.package }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
