name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Read-only floor. release-please re-declares its own scope, which replaces
# this block rather than adding to it — so the default stays least-privilege
# even if a new job forgets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Version bumps, CHANGELOGs, git tags, and GitHub Releases from Conventional
  # Commits. Two independent distribution channels read this job's output:
  # `publish` below (npm registry, stable — one release per package version)
  # and `bun run release:dist` (GitHub `<package>-dist` branches, nightly —
  # scripts/release-dist-branch.mjs, run manually, always tracks the tip of
  # main regardless of whether a release was just cut).
  release-please:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action authenticates with RELEASE_PAT; these grants document what a
    # fallback to GITHUB_TOKEN would need (release PRs, tags, labels).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm registry, stable channel. Idempotent by design: every push to main
  # walks release-please-config.json's package list and publishes only the
  # versions missing from the registry (checked via `npm view`), instead of
  # gating on release-please's one-shot releases_created/paths_released
  # output. That output is only true on the exact run that cuts the release,
  # so a publish failure on that run (bad token, registry outage, ...)
  # previously had no retry short of a new release — now the very next push,
  # or a manual workflow_dispatch, just picks up whatever didn't land.
  # `--provenance` needs `id-token: write`; NPM_TOKEN must be an npm
  # Automation token with publish rights on the @instafix scope (see
  # package-install-guide.md).
  publish:
    needs: release-please
    if: ${{ always() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build
        run: bun run build

      - name: Publish versions missing from the npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in $(jq -r '.packages | keys[]' release-please-config.json); do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip: $name@$version already on npm"
              continue
            fi
            echo "publishing: $name@$version"
            (cd "$pkg" && npm publish --access public --provenance)
          done
